<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E6E4DB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gauntlet">
<title>Nuzlocke Gauntlet</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --shell:#D62828; --shell2:#B81F1F; --screen:#EEF2E8; --card:#FFFFFF; --ink:#1B1F1A; --soft:#5F6A5E;
    --rule:#C9D1C3; --accent:#D62828; --onaccent:#FFFFFF; --dead:#C0392B; --live:#1E8E5A;
    --lens:#3FA9F5; --lensdark:#1C6FB5;
    --font:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;touch-action:manipulation}
  html,body{background:var(--shell)}
  body{color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%;
       background:linear-gradient(180deg,var(--shell) 0%,var(--shell2) 100%);min-height:100vh}
  #app{max-width:560px;margin:0 auto;padding:10px 12px calc(28px + env(safe-area-inset-bottom))}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  input{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:2px solid var(--ink);
        border-radius:8px;padding:10px 12px;width:100%;outline:0}
  input:focus{border-color:var(--accent)}
  input::placeholder{color:var(--soft)}

  .row{display:flex;align-items:center;gap:8px}
  .grow{flex:1;min-width:0}
  .muted{color:var(--soft)}
  .small{font-size:14px}
  .tiny{font-size:12px}
  .serif{font-family:var(--font)}

  /* ---- device top: lens, lights, title ---- */
  .devtop{display:flex;align-items:center;gap:14px;padding:10px 6px 14px;color:var(--onshell)}
  .lens{width:52px;height:52px;border-radius:50%;flex:0 0 auto;
        background:radial-gradient(circle at 38% 35%,#BFE6FF 0%,var(--lens) 35%,var(--lensdark) 100%);
        border:4px solid rgba(255,255,255,.92);box-shadow:0 3px 8px rgba(0,0,0,.35),inset 0 -3px 6px rgba(0,0,0,.25)}
  .lights{display:flex;gap:7px;align-self:flex-start;margin-top:4px}
  .lights i{width:11px;height:11px;border-radius:50%;display:block;border:1.5px solid rgba(0,0,0,.35);
            box-shadow:inset 0 1px 2px rgba(255,255,255,.6)}
  .lights .r{background:#FF4D4D}.lights .y{background:#FFD23F}.lights .g{background:#4ADE80}
  .devtitle{margin-left:auto;text-align:right;min-width:0}
  .devtitle .title{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .devtitle .sub{font-size:13px;opacity:.9;margin-top:2px}

  /* ---- the screen ---- */
  .screen{background:var(--screen);border-radius:18px;padding:14px 14px 18px;
          border:3px solid rgba(0,0,0,.35);
          box-shadow:inset 0 2px 10px rgba(0,0,0,.25),0 4px 14px rgba(0,0,0,.25)}

  /* game switcher */
  .gametabs{display:flex;gap:5px;margin-bottom:14px}
  .gametabs button{flex:1;min-width:0;padding:9px 0;border-radius:8px;font-size:12.5px;font-weight:700;
                   color:var(--ink);background:var(--card);border:2px solid var(--ink)}
  .gametabs button.on{background:var(--ink);color:var(--screen)}
  .gametabs .sw{display:none}
  .band{display:none}

  /* dialogue-box panels */
  .box{background:var(--card);border:3px solid var(--ink);border-radius:10px;padding:12px 14px}

  /* level cap */
  .cap{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;
       background:var(--card);border:3px solid var(--ink);border-radius:10px;padding:12px 14px}
  .cap.over{background:var(--dead);color:#fff;border-color:#7A1E17}
  .cap.over .tiny,.cap.over .muted{color:rgba(255,255,255,.85)}
  .capnum{font-size:36px;font-weight:800;line-height:1;letter-spacing:-.02em}
  .cap .tiny{font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}
  .cap input{width:84px;text-align:center;font-size:20px;font-weight:700;padding:7px 6px}
  .cap.over input{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.5)}

  /* badges */
  .badges{display:flex;gap:6px;padding:10px 6px;margin-bottom:12px;background:var(--card);
          border:3px solid var(--ink);border-radius:10px;justify-content:space-between}
  .badges button{display:flex;justify-content:center;flex:1}
  .dot{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);
       background:var(--dotc,#999)!important;opacity:.38;filter:saturate(.35)}
  .dot.on{opacity:1;filter:none;box-shadow:inset 0 -3px 4px rgba(0,0,0,.25),inset 0 2px 3px rgba(255,255,255,.55),0 2px 4px rgba(0,0,0,.25)}

  /* stats */
  .stats{display:flex;align-items:baseline;gap:18px;margin-bottom:12px;font-size:14px;font-weight:600}
  .stats b{font-size:24px;font-weight:800;margin-right:3px}
  .hp{height:10px;border-radius:999px;background:#2A2F2A;border:2px solid var(--ink);margin:-4px 0 14px;overflow:hidden}
  .hp i{display:block;height:100%;background:linear-gradient(90deg,#3DD68C,#1E8E5A);border-radius:999px;transition:width .3s}

  .alert{padding:12px 14px;margin-bottom:12px;font-size:14px;font-weight:600;background:var(--dead);color:#fff;
         border:3px solid #7A1E17;border-radius:10px}

  /* section tabs */
  .tabs{display:flex;gap:5px;margin-bottom:12px}
  .tabs button{flex:1;padding:8px 2px;border-radius:8px;font-size:13px;font-weight:700;color:var(--ink);
               background:var(--card);border:2px solid var(--ink)}
  .tabs button.on{background:var(--accent);color:var(--onaccent);border-color:var(--ink)}

  /* filters */
  .chips{display:flex;gap:6px;margin-bottom:10px}
  .chips button{padding:7px 11px;font-size:13px;font-weight:700;border-radius:999px;color:var(--ink);
                background:var(--card);border:2px solid var(--ink)}
  .chips button.on{background:var(--ink);color:var(--screen)}

  /* area rows */
  .area{padding:11px 0;border-bottom:2px dashed var(--rule)}
  .area:last-of-type{border-bottom:0}
  .log{padding:7px 14px;font-size:14px;font-weight:700;border-radius:999px;color:var(--ink);
       background:var(--card);border:2px solid var(--ink)}
  .log.on{background:var(--ink);color:var(--screen)}
  .species{font-size:17px;font-weight:700}
  .species.dead{color:var(--dead);text-decoration:line-through;font-weight:600}
  .state{padding:5px 10px;font-size:12px;font-weight:700;border-radius:999px;color:#fff;background:var(--live);border:2px solid var(--ink)}
  .state.dead{background:var(--dead)}
  .x{color:var(--soft);font-size:22px;padding:0 4px;line-height:1}

  /* picker: dialogue box */
  .picker{margin-top:10px;padding:12px;background:var(--card);border:3px solid var(--ink);border-radius:10px}
  .pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .pool button{padding:9px 13px;font-size:15px;font-weight:600;border-radius:999px;background:var(--screen);border:2px solid var(--ink)}
  .pool button.blocked{border-color:var(--rule);color:var(--soft);background:transparent;text-decoration:line-through;font-weight:500}
  .pact{display:flex;gap:8px;margin-top:8px}
  .pact button{padding:10px 14px;font-size:14px;font-weight:700;border-radius:8px;border:2px solid var(--ink)}
  .primary{background:var(--accent);color:var(--onaccent)}
  .ghost{color:var(--ink);background:var(--card)}
  .cause{margin-top:8px;font-size:14px}

  /* rules & league */
  .rule{padding:12px 0;border-bottom:2px dashed var(--rule)}
  .rule h3{font-size:15px;font-weight:800;margin-bottom:3px}
  .rule p{font-size:14px;color:var(--soft);line-height:1.5}
  .sectionhead{margin-top:18px;padding:10px 12px;background:var(--card);border:3px solid var(--ink);border-radius:10px;
               font-size:16px;font-weight:800;margin-bottom:8px}

  footer{margin-top:22px;padding-top:12px;border-top:2px dashed currentColor;opacity:.9;
         display:flex;flex-wrap:wrap;align-items:center;gap:14px;font-size:13px;color:var(--soft)}
  footer button{text-decoration:underline;text-underline-offset:3px;font-weight:600}
  #status{margin-left:auto}
  #status.err{color:var(--dead)}

  .hof{background:var(--card);border:3px solid var(--live);border-radius:10px;overflow:hidden;margin-bottom:12px}
  .hof .hd{background:var(--live);color:#fff;padding:10px 14px}
  .hof .hd .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;opacity:.88}
  .hof .hd .nm{font-size:20px;font-weight:800;line-height:1.15}
  .hof .meta{display:flex;gap:16px;padding:9px 14px;border-bottom:2px dashed var(--rule);
             font-size:12px;color:var(--soft);font-weight:700}
  .hof ol{margin:0;padding:2px 14px 8px;list-style:none}
  .hof li{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:2px dashed var(--rule)}
  .hof li:last-child{border-bottom:0}
  .hof li .n{font-size:11px;color:var(--soft);font-weight:700;min-width:12px}
  .hof .foot{padding:2px 14px 12px}
  .hof .foot button{font-size:12px;color:var(--soft);text-decoration:underline}
  .gaunt{background:var(--card);border:3px solid var(--ink);border-radius:10px;padding:4px 14px 10px}
  .gaunt .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
              color:var(--soft);padding:10px 0 2px}
  .gaunt .g{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:2px dashed var(--rule)}
  .gaunt .g:last-child{border-bottom:0}
  .gaunt .g .nm{flex:1;font-size:14px;font-weight:600}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;
        border:2px solid var(--rule);color:var(--soft);white-space:nowrap}
  .pill.done{background:var(--live);border-color:var(--live);color:#fff}
  .pill.now{border-color:var(--ink);color:var(--ink)}
  .hofpick{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed var(--rule)}
  .hofpick:last-of-type{border-bottom:0}

  .lmember{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
           padding:9px 0;border-bottom:2px dashed var(--rule)}
  .lmember:last-of-type{border-bottom:0}
  .lmember .nm{flex:1;font-size:14px;font-weight:600}
  .lmember .lv{font-size:12px;color:var(--soft);font-weight:700;white-space:nowrap}
  .lmember.beat .nm{color:var(--soft);text-decoration:line-through}

  .sndbtn{width:34px;height:34px;flex:0 0 auto;padding:0;border-radius:8px;
          border:2px solid var(--onshell);background:transparent;text-decoration:none;
          display:inline-flex;align-items:center;justify-content:center;
          transition:background .12s,opacity .12s}
  .sndbtn svg{width:18px;height:18px;display:block}
  .sndbtn .stem{fill:none;stroke:var(--onshell);stroke-width:1.8;
                stroke-linecap:round;stroke-linejoin:round}
  .sndbtn .head{fill:var(--onshell)}
  .sndbtn .slash{display:none;stroke:var(--onshell);stroke-width:2.2;stroke-linecap:round}
  .sndbtn.on{background:var(--onshell)}
  .sndbtn.on .stem{stroke:var(--shell)}
  .sndbtn.on .head{fill:var(--shell)}
  .sndbtn.off{background:transparent;opacity:.55}
  .sndbtn.off .slash{display:block}

  .species.evo{text-align:left;text-decoration:underline dotted;text-underline-offset:4px;
               text-decoration-color:var(--rule)}
  .wasline{font-size:11.5px;color:var(--soft);font-style:italic;margin-top:3px}
  .evobox{margin-top:9px;gap:8px}

  .causeline{display:block;width:100%;text-align:left;text-decoration:underline dotted;
             text-decoration-color:var(--rule);text-underline-offset:3px}

  .legrow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
          padding:9px 0;border-bottom:2px dashed var(--rule)}
  .legrow:last-of-type{border-bottom:0}
  .legrow .nm{font-size:14px;font-weight:700;min-width:92px}
  .legrow .loc{flex:1;font-size:12px;color:var(--soft)}
  .legrow .ltag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
                padding:2px 7px;border-radius:999px;border:2px solid var(--rule);color:var(--soft)}
  .legrow.got .nm{color:var(--live)}
  .legrow.got .loc{text-decoration:line-through}
  .legline{font-size:11.5px;color:var(--soft);margin-top:3px}
  .legline b{color:var(--ink);font-weight:700}

  .legrow .lst{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
               padding:2px 8px;border-radius:999px;color:#fff;background:var(--soft);white-space:nowrap}
  .legrow .lst.caught{background:var(--live)}
  .legrow .lst.dead{background:var(--dead)}
  .legrow .lst.lost{background:var(--soft)}
  .legrow .lst.used{background:transparent;color:var(--soft);border:2px solid var(--rule);
                    text-transform:none;font-weight:600}
  .legrow.caught .nm{color:var(--live)}
  .legrow.dead .nm{color:var(--dead);text-decoration:line-through}
  .legrow.used .nm,.legrow.lost .nm{color:var(--soft)}

  .area .row,.legrow,.lmember,.gaunt .g{min-width:0}
  .species,.wasline,.causeline,.legrow .nm,.legrow .loc,.lmember .nm,
  .gaunt .g .nm,.hof li .species{min-width:0;overflow-wrap:anywhere}
  .species{flex:0 1 auto}
  .grow,.small,.tiny{overflow-wrap:anywhere}

  .pickrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
           padding:11px 0;border-bottom:2px dashed var(--rule)}
  .pickrow:last-of-type{border-bottom:0}
  .pickrow .num{width:26px;height:26px;flex:0 0 auto;border-radius:50%;border:2px solid var(--rule);
                color:var(--soft);display:inline-flex;align-items:center;justify-content:center;
                font-size:12px;font-weight:700}
  .pickrow.on .num{background:var(--live);border-color:var(--live);color:#fff}
  .pickrow .nm{flex:1;font-size:15px;font-weight:700;overflow-wrap:anywhere}
  .pickrow .rg{font-size:12px;color:var(--soft);white-space:nowrap}
</style>
</head>

/* Names the decomp spells differently from the Pokédex. */
const SPECIAL_SPECIES = {
  NIDORAN_M:"Nidoran♂", NIDORAN_F:"Nidoran♀", MR_MIME:"Mr. Mime", MIME_JR:"Mime Jr.",
  FARFETCHD:"Farfetch'd", HO_OH:"Ho-Oh", PORYGON_Z:"Porygon-Z", PORYGON2:"Porygon2",
  TYPE_NULL:"Type: Null", JANGMO_O:"Jangmo-o", HAKAMO_O:"Hakamo-o", KOMMO_O:"Kommo-o",
  DEOXYS_NORMAL:"Deoxys", SIRFETCHD:"Sirfetch'd", FLABEBE:"Flabébé"
};
const FLOOR_PART = /^(B?\d+F|\d+F|ROOM\d*|CHAMBER|ENTRANCE|INSIDE|EXTERIOR|NORTH|SOUTH|EAST|WEST|AREA\d*|HOUSE\d*)$/;

function niceSpecies(raw){
  let s = String(raw).replace(/^SPECIES_/, "");
  if (!s || s === "NONE") return null;
  if (SPECIAL_SPECIES[s]) return SPECIAL_SPECIES[s];
  return s.split("_").map(w => w.charAt(0) + w.slice(1).toLowerCase()).join(" ");
}
function niceMap(raw){
  const parts = String(raw).replace(/^MAP_/, "").split("_").filter(p => !FLOOR_PART.test(p));
  return parts.map(p => {
    const m = p.match(/^ROUTE(\d+)$/);
    if (m) return "Route " + m[1];
    return p.charAt(0) + p.slice(1).toLowerCase();
  }).join(" ").trim();
}
function collectSpecies(node, out){
  if (!node || typeof node !== "object") return;
  if (Array.isArray(node)) return node.forEach(n => collectSpecies(n, out));
  Object.keys(node).forEach(k => {
    const v = node[k];
    if (k === "species" && typeof v === "string"){
      const n = niceSpecies(v);
      if (n) out.add(n);
    } else collectSpecies(v, out);
  });
}
/* Walks any decomp wild_encounters.json and returns { "Area": ["Species", ...] } */
function parseDecomp(json){
  const tables = {};
  (function walk(node){
    if (!node || typeof node !== "object") return;
    if (Array.isArray(node)) return node.forEach(walk);
    if (typeof node.map === "string" && node.map.indexOf("MAP_") === 0){
      const name = niceMap(node.map);
      if (!name) return;
      const set = new Set(tables[name] || []);
      collectSpecies(node, set);
      if (set.size) tables[name] = Array.from(set).sort();
      return;
    }
    Object.keys(node).forEach(k => walk(node[k]));
  })(json);
  return tables;
}
/* Matches parsed areas onto this game's route list; unmatched ones get added. */
function applyTables(tables){
  const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                     .toLowerCase().replace(/[^a-z0-9]/g, "");
  const known = {};
  routesOf().forEach(r => known[norm(r)] = r);
  const target = {};
  let matched = 0, added = 0;
  Object.keys(tables).forEach(k => {
    const hit = known[norm(k)];
    if (hit){ target[hit] = tables[k]; matched++; }
    else {
      target[k] = tables[k];
      if (gd().extra.indexOf(k) === -1){ gd().extra.push(k); added++; }
    }
  });
  ENCOUNTERS[S.active] = Object.assign({}, ENCOUNTERS[S.active], target);
  try { localStorage.setItem(ENC_KEY, JSON.stringify(ENCOUNTERS)); } catch(e){}
  save();
  return { matched:matched, added:added };
}

function lineKey(s){
  const n = String(s).replace(/\u2642/g,'-m').replace(/\u2640/g,'-f')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]/g,'');
  const base = n.replace(/(alola|galar|hisui|paldea)$/,'');
  const c = LINES[n] !== undefined ? LINES[n] : LINES[base];
  return c !== undefined ? 'c'+c : 'n'+n;   // fall back to the name for anything unknown
}

const RULES = [
  ["Starter","Free. Pick it, log it in the Starter slot, and it costs you no encounter. Nothing else counts as an encounter until you have Poké Balls — Route 1 on the way to the shop is a free walk. Once you can throw a ball, every rule applies."],
 ["Encounters","One encounter per area. The first wild Pokémon you meet there, and nothing else. Fail the catch and the area is spent."],
 ["Dupes clause","Checked against whole evolution lines, not just species — a living Pidgeotto blocks Pidgey, and a Chimchar blocks Infernape. Regional forms count as their base line. Nidoran male and female are separate lines. Fleeing a dupe does not burn the encounter."],
 ["Duped-out areas","If you already hold everything an area can give, move on. No catch, no penalty, and the area is not closed. When one of your living Pokémon dies and frees that line, you may go back for it."],
 ["Shiny clause","Always catchable, always usable."],
 ["Death","Faints once, dead forever. Never healed, never withdrawn, never used again."],
  ["The Dead box","Nothing is ever released. Every death goes into a PC box named Dead and stays there for the rest of the run, so you can walk the graveyard before you finish each game."],
 ["End condition","The run ends only when every Pokémon you own is dead — box included. Losing your active six means rebuilding from reserves, not restarting."],
 ["Losing a game","Total extinction restarts that game only. Games already cleared stay cleared, and you never drop back down the gauntlet. Lose Emerald and you start Emerald, not Fire Red. Each game has its own graveyard. A restart is a new attempt, so it resets — the graveyard you review at the end is the one from the run you finished."],
 ["Level cap","Nothing may exceed the ace level of the next Gym Leader. Grind freely up to it."],
 ["League cap","The Elite Four and the Champion share one cap, taken from the last Elite Four member. There is no box access once you walk in, so levels gained inside the League do not count against it."],
 ["Battle style","Set mode. No free switch when the opponent sends something out, so every lead is a commitment."],
 ["Items","Two healing items per battle, no exceptions — Gym Leaders, the Elite Four and Rivals included. Anything that restores HP or clears a status counts: Potions, Antidotes, Burn Heals, Awakenings, Full Heals. Revives are banned outright, in battle and out of it — a faint is a death. Otherwise there is no limit outside battle. Heal as much as you like between fights, including between Elite Four members."],
 ["Gifts","Only gifts, fossils and eggs come free. Statics count as that area's encounter, legendaries included, so walking into the Snorlax on Route 12 spends Route 12. The free ones still obey the dupes clause, still die permanently, and belong in the Gifts list so the graveyard stays complete."],
 ["Breeding","Locked until the Elite Four is down. Infinite eggs are a safety net, and you should only have one once the run is effectively over and you are deciding whether to move on."],
  ["Legendaries","Repelling your way to a Legendary is legal — it breaks none of the core rules. But you get one attempt at it. Catch it first try and it is yours to use. Run out of balls, or fail to catch it, and you must knock it out. There are no save reloads. Anything it kills stays dead, and if it takes your whole party that is a wipe like any other. Roamers work the same way but you only ever get the one meeting: if it flees, that area is spent, exactly like an Abra teleporting away."],
 ["Gauntlet","Beat each game before starting the next, in the order you picked in your loadout."]
];

    statusTimer = setTimeout(() => { const e2 = document.getElementById("status"); if (e2) e2.textContent = ""; }, 1600);
  } catch(e){
    if (el){ el.textContent = "Not saved — export a backup"; el.className = "err"; }
  }
}

/* ---------------- helpers ---------------- */
const loadout = () => (Array.isArray(S.loadout) && S.loadout.length) ? S.loadout : GAMES.map(g => g.id);
const loadoutGames = () => loadout().map(id => GAMES.find(g => g.id === id)).filter(Boolean);
const game = () => GAMES.find(g => g.id === S.active);
const gd   = () => S.games[S.active];
const routesOf = () => game().routes.concat(gd().extra);
const pool = r => {
  const base = (ENCOUNTERS[S.active] || {})[r] || [];
  const LG = LEGENDS[S.active];
  const cleared = leagueCleared();
  const leg = (LG && LG.fixed[r]) ? LG.fixed[r].filter(p => p[1] === "" || cleared).map(p => p[0]) : [];
  return leg.length ? leg.concat(base.filter(x => leg.indexOf(x) < 0)) : base;
};

// an area whose legendaries are all post-game or event stays shut until the League falls
function leagueCleared(){
  const g0 = GAMES.find(x => x.id === S.active), d0 = gd();
  if (!g0) return false;
  return !!d0.hof || (g0.league.members.length > 0 && (d0.league || []).length >= g0.league.members.length);
}
// Only a legendary-only site can be shut. Any route with wild encounters of its
// own stays open all run; the gated legendary simply is not in the pick list yet.
function legLocked(r){
  const LG = LEGENDS[S.active];
  const at = LG && LG.fixed[r];
  if (!at || !at.length) return false;
  if (((ENCOUNTERS[S.active] || {})[r] || []).length) return false;
  return !leagueCleared() && at.every(p => p[1] === "post" || p[1] === "event");
}

// the Legends list is a read-out of the area log, never edited directly
let _spCache = {};
function speciesList(){
  if (_spCache[S.active]) return _spCache[S.active];
  const set = new Set();
  const enc = ENCOUNTERS[S.active] || {};
  Object.keys(enc).forEach(k => (enc[k] || []).forEach(x => set.add(x)));
  const LG = LEGENDS[S.active];
  if (LG){
    Object.keys(LG.fixed).forEach(loc => LG.fixed[loc].forEach(p => set.add(p[0])));
    (LG.roam || []).forEach(p => set.add(p[0]));
  }
  return (_spCache[S.active] = [...set].sort());
}
function legendRows(){
  const LG = LEGENDS[S.active] || { fixed:{}, roam:[] };
  const lg = gd().log || {}, gifts = gd().gifts || [];
  const anywhere = name => {
    const n = name.toLowerCase();
    for (const k in lg) if (lg[k].species && lg[k].species.toLowerCase() === n) return k;
    for (const x of gifts) if (x.species && x.species.toLowerCase() === n) return "Gift";
    return null;
  };
  const rows = [];
  Object.keys(LG.fixed).forEach(loc => LG.fixed[loc].forEach(p => {
    const e = lg[loc] || {};
    let st = "open", note = "";
    if (e.species && e.species.toLowerCase() === p[0].toLowerCase()) st = e.dead ? "dead" : "caught";
    else if (e.lost) st = "lost";
    else if (e.species){ st = "used"; note = e.species; }
    else { const w = anywhere(p[0]); if (w){ st = "caught"; note = w; } }
    rows.push({ name:p[0], tag:p[1], loc:loc, st:st, note:note });
  }));
  (LG.roam || []).forEach(p => {
    const w = anywhere(p[0]);
    rows.push({ name:p[0], tag:p[1], loc:"Roaming", st:w?"caught":"open", note:w||"" });
  });
  const rank = t => t === "" ? 0 : (t === "post" ? 1 : 2);
  rows.sort((a,b) => rank(a.tag) - rank(b.tag) || a.name.localeCompare(b.name));
  return rows;
}

function entries(){
  return routesOf().map(r => Object.assign({ route:r }, gd().log[r] || {}));
}
const giftsOf = () => (gd().gifts = gd().gifts || []);
function addGift(species){
  if (!species) return;
  giftsOf().push({ id: Date.now() + Math.random(), species: species, dead:false, cause:"" });
  SFX.catch(); save(); render();
}
function removeGift(id){
  const gs = giftsOf(), i = gs.findIndex(x => String(x.id) === String(id));
  if (i < 0) return;
  if (gs[i].gid) gd().grave = (gd().grave || []).filter(x => x.id !== gs[i].gid);
  gs.splice(i, 1); save(); render();
}
function toggleGift(id){
  const x = giftsOf().find(y => String(y.id) === String(id));
  if (!x) return;
  if (x.dead){
    gd().grave = (gd().grave || []).filter(z => z.id !== x.gid);
    x.dead = false; x.gid = undefined; ui.gcause = null; SFX.tap();
  } else {
    const gid = Date.now() + Math.random();
    gd().grave.push({ id:gid, species:x.species, from:x.caught || "", route:"Gift", cause:x.cause || "", attempt:gd().attempt || 1 });
    x.dead = true; x.gid = gid; ui.gcause = String(id); SFX.dead();
  }
  save(); render();
}
function livingRoster(){
  const out = [];
  entries().forEach(e => { if (e.species && !e.dead) out.push({ species:e.species, from:e.route }); });
  (gd().gifts || []).forEach(x => { if (x.species && !x.dead) out.push({ species:x.species, from:"Gift" }); });
  return out;
}
function enterHof(team){
  const d = gd();
  // beating the Champion means the whole League is down
  const mem = (GAMES.find(x => x.id === S.active) || { league:{ members:[] } }).league.members;
  d.league = mem.map((m, i) => i);
  d.hof = { date:new Date().toISOString().slice(0,10), attempt:d.attempt || 1, team:team,
            deaths:(d.grave || []).filter(x => (x.attempt || 1) === (d.attempt || 1)).length };
  SFX.badge(); save(); render();
}
function clearHof(){ gd().hof = null; save(); render(); }
function livingLines(){
  const m = new Map();          // evolution-chain key -> the species you hold from it
  entries().forEach(e => {
    if (e.species && !e.dead){
      const k = lineKey(e.species);
      if (!m.has(k)) m.set(k, e.species.trim());
    }
  });
  (gd().gifts || []).forEach(x => {
    if (x.species && !x.dead){
      const k = lineKey(x.species);
      if (!m.has(k)) m.set(k, x.species.trim());
    }
  });
  return m;
}
function graveyard(){ return (gd().grave || []).slice().reverse(); }
function markDead(r){
  const e = gd().log[r] || {};
  const gid = Date.now() + Math.random();
  gd().grave.push({ id:gid, species:e.species, from:e.caught || "", route:r, cause:e.cause || "", attempt:gd().attempt || 1 });
  gd().log[r] = Object.assign({}, e, { dead:true, gid:gid });
}
function markAlive(r){
  const e = gd().log[r] || {};
  gd().grave = (gd().grave || []).filter(x => x.id !== e.gid);
  gd().log[r] = Object.assign({}, e, { dead:false, gid:undefined });
}
function restartGame(){
  const d = gd();
  d.log = {}; d.badges = 0; d.top = ""; d.grave = []; d.gifts = []; d.hof = null; d.league = []; d.legends = []; d.attempt = (d.attempt || 1) + 1;
  ui.open = null; ui.filter = "todo";
  save(); render();
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------------- mutations ---------------- */
function writeArea(r, patch){
  const log = gd().log;
  log[r] = Object.assign({}, log[r] || {}, patch);
  save(); render();
}
function clearArea(r){ delete gd().log[r]; save(); render(); }
function pick(r, species){
  SFX.catch();
  writeArea(r, { species:species, dead:false, lost:false });
  ui.open = null; ui.draft = "";
  render();
}

function renderSetup(){

              <ol>`;
      (hof.team||[]).forEach((t,i) => {
        h += `<li><span class="n">${i+1}</span><span class="species grow">${esc(t.species)}</span><span class="tiny muted">${esc(t.from)}</span></li>`;
      });
      h += `</ol><div class="foot"><button data-hofclear="1">Clear this record</button></div></div>`;
    } else if (d.badges < 8){
      h += `<div class="box" style="margin-bottom:12px"><p class="small muted" style="margin:0">Win all eight badges, beat the League, then log the team that finished ${esc(g.name)}. You can tick the Elite Four off in Caps as you go, but you do not have to.</p></div>`;
    } else {
      const roster = livingRoster();
      const auto = roster.length <= 6;
      ui.hofPick = (ui.hofPick || []).filter(k => roster.some(x => x.species + "|" + x.from === k));
      h += `<div class="box" style="margin-bottom:12px">
              <div class="tiny muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.08em">Enter the Hall</div>
              <p class="small muted" style="margin:6px 0 4px">${auto ? "Beat the Champion, then log the survivors." : "More than six alive &mdash; pick the six that fought."}</p>`;
      if (!roster.length) h += `<p class="small muted" style="margin:8px 0 0">Nothing is alive to enter the Hall.</p>`;
      roster.forEach(x => {
        const key = x.species + "|" + x.from;
        const on = auto || ui.hofPick.indexOf(key) >= 0;
        h += `<div class="hofpick">
                <button class="log ${on?"on":""}" data-hofpick="${esc(key)}"${auto?" disabled":""}>${on?"In":"Out"}</button>
                <span class="species grow">${esc(x.species)}</span>
                <span class="tiny muted">${esc(x.from)}</span>
              </div>`;
      });
      if (roster.length){
        const n = auto ? roster.length : ui.hofPick.length;
        h += `<button id="hofenter" class="log" style="margin-top:14px;width:100%;background:var(--live);color:#fff;border-color:var(--live)"${(!auto && (n<1||n>6))?" disabled":""}>Beat the Champion &middot; log ${n}</button>`;
      }
      h += `</div>`;
    }
    {
      const lg = legCaught;
      h += `<div class="box" style="margin-bottom:12px">
              <div class="tiny muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.08em">Legendary hunt</div>
              <p class="small" style="margin:6px 0 0"><b style="font-size:20px">${lg}</b> of ${legTotal} caught in ${esc(g.name)}</p>`;
      if (d.hof && d.hof.finished)
        h += `<p class="tiny muted" style="margin:6px 0 0">Run closed ${esc(d.hof.finished)} with ${d.hof.legends||0} legendaries.</p>`;
      else if (d.hof)
        h += `<p class="tiny muted" style="margin:6px 0 8px">The League is done. Hunt for as long as you like, then call it.</p>
              <button class="log" data-finish="1">Call the run finished</button>`;
      else
        h += `<p class="tiny muted" style="margin:6px 0 0">Catch them as you go. You can call the run finished once the League is down.</p>`;
      h += `</div>`;
    }
    h += `<div class="gaunt"><div class="lbl">The gauntlet</div>`;
    loadoutGames().forEach((x,i) => {
      const gx = S.games[x.id] || {};
      const done = !!gx.hof;
      const started = !!(Object.keys(gx.log||{}).length || gx.badges || (gx.gifts||[]).length);
      h += `<div class="g">
              <div class="dot ${done?"on":""}" style="width:16px;height:16px;--dotc:${done?"#1E8E5A":"#B8B5A8"}"></div>
              <span class="nm">${i+1}. ${esc(x.name)}</span>
              <span class="pill ${done?"done":(x.id===S.active?"now":"")}">${done ? esc(gx.hof.date) : (started ? "in progress" : "not started")}</span>
            </div>`;
    });
    h += `<div style="margin-top:10px;padding-top:12px;border-top:2px dashed var(--rule)">`;
    if (ui.armReset)
      h += `<p class="small" style="color:var(--dead);margin:0 0 8px">This starts a whole new gauntlet and deletes every run you have. There is no undo.</p>
            <div class="row"><button class="log" data-resetgo="1" style="background:var(--dead);color:#fff;border-color:var(--dead)">I understand, continue</button>
            <button class="log" data-resetcancel="1">Keep my runs</button></div>`;
    else
      h += `<button class="log" data-resetarm="1">Change games &middot; new gauntlet</button>`;
    h += `</div>`;
    h += `</div>`;
  }

  if (ui.tab === "caps"){
    g.gyms.forEach((gy,i) => {
      const got = i < d.badges, next = !atLeague && i === d.badges;
      h += `<button class="lmember${got?" beat":""}" data-badge="${i}">
              <div class="dot ${got?"on":""}" style="width:18px;height:18px;--dotc:${TYPE[gy[1]]||"#B8B5A8"}"></div>
              <span class="nm">${i+1}. ${esc(gy[0])}</span>
              <span class="tiny muted">${esc(gy[1])}</span>
              <span class="lv" style="min-width:26px;text-align:right;font-size:15px;font-weight:${next?800:600}">${gy[2]}</span>
            </button>`;
    });
    h += `<div class="sectionhead row" style="align-items:baseline">
            <span class="grow">Pokémon League</span>
            <span style="font-size:26px;font-weight:${atLeague?800:600}">${g.league.cap}</span>
          </div>
          <p class="small muted" style="max-width:62ch;margin:0 0 12px">${
            S.active==="unbound"
              ? "The league scales to your highest-level Pokémon, so this is the game's ceiling rather than an opponent's ace."
              : "One cap for everything below, set by " + esc(g.league.anchor) + ". No box access once you're in."
          }</p>`;
    {
      const beaten = (d.league || []);
      h += `<p class="tiny muted" style="margin:2px 0 6px">${beaten.length} of ${g.league.members.length} beaten &mdash; tap to mark</p>`;
      g.league.members.forEach((m,i) => {
        const won = beaten.indexOf(i) >= 0;
        h += `<button class="lmember${won?" beat":""}" data-league="${i}">
                <div class="dot ${won?"on":""}" style="width:16px;height:16px;--dotc:${TYPE[m[1]]||"#B8B5A8"}"></div>
                <span class="nm">${esc(m[0])}</span>
                <span class="lv">${m[2]?"Lv "+m[2]:"scales"}</span>
              </button>`;
      });
    }
  }

  if (ui.tab === "rules"){
    RULES.forEach(r => { h += `<div class="rule"><h3>${esc(r[0])}</h3><p>${esc(r[1])}</p></div>`; });
  }

  if (ui.tab === "grave"){
    if (!grave.length) h += `<p class="small muted" style="padding:16px 0">Nobody has died in ${esc(g.name)} yet.</p>`;
    grave.forEach(m => {
      h += `<div class="area">
              <div class="row" style="align-items:baseline">
                <span class="species dead grow">${esc(m.species)}</span>
                <span class="small muted">${esc(m.route)}</span>
              </div>
              ${m.from&&m.from!==m.species?`<div class="wasline">caught as ${esc(m.from)}</div>`:""}
              ${m.cause?`<p class="small muted" style="margin-top:3px">${esc(m.cause)}</p>`:""}
            </div>`;
    });
  }

  h += `</div><footer style="color:var(--onshell);border-top-color:var(--onshell)">
          <button id="export">Export backup</button>
          <button id="import">Import</button>
          <button id="mute" class="sndbtn ${muted?"off":"on"}" title="${muted?"Sound off":"Sound on"}" aria-label="${muted?"Sound off":"Sound on"}" aria-pressed="${muted?"false":"true"}"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="stem" d="M9.6 16.9V5.7l8.4-1.7v11.2"/><path class="head" d="M9.6 5.7 18 4v2.7L9.6 8.4z"/><circle class="head" cx="7.3" cy="17.2" r="2.5"/><circle class="head" cx="15.7" cy="15.4" r="2.5"/><line class="slash" x1="3.8" y1="20.2" x2="20.2" y2="3.8"/></svg></button>
          <span id="status"></span><span class="tiny" style="margin-left:auto;opacity:.65">build 19</span>
        </footer>
        <input type="file" id="file" accept="application/json" style="display:none">
`;

  h += `<datalist id="splist">${speciesList().map(x => `<option value="${esc(x)}"></option>`).join("")}</datalist>`;

  const _q = document.getElementById("areaq");
  ui.qFocus = !!(_q && document.activeElement === _q);
  document.getElementById("app").innerHTML = h;
  wire();
}

/* ---------------- events ---------------- */
function wire(){
  const $ = s => document.querySelector(s);
  const all = (s, fn) => document.querySelectorAll(s).forEach(fn);

  all("[data-game]", b => b.onclick = () => { SFX.tap(); S.active = b.dataset.game; ui.open=null; ui.draft=""; save(); render(); });
  all("[data-tab]",  b => b.onclick = () => { SFX.tap(); ui.tab = b.dataset.tab; render(); });
  all("[data-filter]", b => b.onclick = () => { SFX.tap(); ui.filter = b.dataset.filter; ui.open=null; render(); });
  all("[data-badge]", b => b.onclick = () => {
    const i = +b.dataset.badge;
    const earning = gd().badges !== i+1;
    gd().badges = earning ? i+1 : i;
    earning ? SFX.badge() : SFX.tap();
    save(); render();
  });
  all("[data-open]", b => b.onclick = () => {
    ui.open = ui.open === b.dataset.open ? null : b.dataset.open;
    ui.open ? SFX.open() : SFX.tap();
    ui.draft = ""; render();
  });
  all("[data-clear]",  b => b.onclick = () => clearArea(b.dataset.clear));
  all("[data-toggle]", b => b.onclick = () => {
    const r = b.dataset.toggle;
    if ((gd().log[r]||{}).dead){ markAlive(r); ui.cause = null; SFX.tap(); }
    else { markDead(r); ui.cause = r; SFX.dead(); }
    save(); render();
  });
  const rb = $("#restart");
  if (rb) rb.onclick = () => { if (confirm("Start " + game().name + " again? This clears its graveyard.")) { SFX.lost(); restartGame(); } };
  all("[data-pick]", b => b.onclick = () => pick(b.dataset.pick, b.dataset.sp));
  all("[data-commit]", b => b.onclick = () => {
    const v = ($("#draft")||{}).value || "";
    if (v.trim()) pick(b.dataset.commit, v.trim());
  });
  all("[data-lost]", b => b.onclick = () => {
    SFX.lost();
    writeArea(b.dataset.lost, { lost:true, species:"" });
    ui.open = null; render();
  });
  all("[data-cause]", i => i.oninput = () => {
    const r = i.dataset.cause;
    const e = Object.assign({}, gd().log[r]||{}, { cause:i.value });
    gd().log[r] = e;
    const ge = (gd().grave||[]).find(x => x.id === e.gid); if (ge) ge.cause = i.value;
    save();
  });

  const draft = $("#draft");
  if (draft){
    draft.oninput = () => { ui.draft = draft.value; };
    draft.onkeydown = e => {
      if (e.key === "Enter" && draft.value.trim()){
        const btn = document.querySelector("[data-commit]");
        if (btn) pick(btn.dataset.commit, draft.value.trim());
      }
    };
  }

  const top = $("#top");
  if (top) top.oninput = () => {
    gd().top = top.value; save();
    const g = game(), d = gd();
    const atL = d.badges >= 8;
    const cap = atL ? g.league.cap : g.gyms[d.badges][2];
    document.querySelector(".cap").classList.toggle("over", parseInt(top.value,10) > cap);
  };

  const na = $("#newarea"), ab = $("#addarea");
  const addArea = () => {
    const v = (na.value||"").trim();
    if (v && routesOf().indexOf(v) === -1){ gd().extra.push(v); na.value=""; save(); render(); }
  };
  if (ab) ab.onclick = addArea;
  if (na) na.onkeydown = e => { if (e.key === "Enter") addArea(); };

  all("[data-gifttoggle]", b => b.onclick = () => toggleGift(b.dataset.gifttoggle));
  all("[data-giftdel]",    b => b.onclick = () => removeGift(b.dataset.giftdel));
  all("[data-giftcause]",  i => i.oninput = () => {
    const x = (gd().gifts||[]).find(y => String(y.id) === String(i.dataset.giftcause));
    if (!x) return;
    x.cause = i.value;
    const ge = (gd().grave||[]).find(z => z.id === x.gid); if (ge) ge.cause = i.value;
    save();
  });
  const ng = $("#newgift"), ag = $("#addgift");
  const addG = () => { const v = (ng.value||"").trim(); if (v){ ng.value = ""; addGift(v); } };
  if (ag) ag.onclick = addG;
  if (ng) ng.onkeydown = e => { if (e.key === "Enter") addG(); };

  all("[data-hofpick]", b => b.onclick = () => {
    const k = b.dataset.hofpick;
    ui.hofPick = ui.hofPick || [];
    const i = ui.hofPick.indexOf(k);
    if (i >= 0) ui.hofPick.splice(i,1); else if (ui.hofPick.length < 6) ui.hofPick.push(k);
    SFX.tap(); render();
  });
  all("[data-hofclear]", b => b.onclick = () => {
    if (confirm("Clear the Hall of Fame record for " + game().name + "?")) clearHof();
  });
  const he = $("#hofenter");
  if (he) he.onclick = () => {
    const roster = livingRoster();
    const team = (roster.length <= 6) ? roster : roster.filter(x => (ui.hofPick||[]).indexOf(x.species + "|" + x.from) >= 0);
    if (!team.length) return;
    ui.hofPick = [];
    enterHof(team);
  };

  all("[data-league]", b => b.onclick = () => {
    const i = +b.dataset.league, dd = gd();
    dd.league = dd.league || [];
    const at = dd.league.indexOf(i);
    if (at >= 0){ dd.league.splice(at,1); SFX.tap(); } else { dd.league.push(i); SFX.badge(); }
    save(); render();
  });

  all("[data-evolve]", b => b.onclick = () => {
    const r = b.dataset.evolve;
    ui.evolve = ui.evolve === r ? null : r; ui.gevolve = null;
    SFX.tap(); render();
  });
  all("[data-evocommit]", b => b.onclick = () => {
    const r = b.dataset.evocommit, v = (($("#evoin")||{}).value||"").trim();
    if (!v) return;
    const e = Object.assign({}, gd().log[r]||{});
    if (!e.species) return;
    e.caught = e.caught || e.species;
    e.species = v;
    gd().log[r] = e;
    const ge = (gd().grave||[]).find(z => z.id === e.gid); if (ge) ge.species = v;
    ui.evolve = null; SFX.catch(); save(); render();
  });
  all("[data-gevolve]", b => b.onclick = () => {
    const id = b.dataset.gevolve;
    ui.gevolve = ui.gevolve === id ? null : id; ui.evolve = null;
    SFX.tap(); render();
  });
  all("[data-gevocommit]", b => b.onclick = () => {
    const id = b.dataset.gevocommit, v = (($("#gevoin")||{}).value||"").trim();
    if (!v) return;
    const x = (gd().gifts||[]).find(y => String(y.id) === String(id));
    if (!x) return;
    x.caught = x.caught || x.species;
    x.species = v;
    ui.gevolve = null; SFX.catch(); save(); render();
  });
  const evoin = $("#evoin");
  if (evoin) evoin.onkeydown = ev => { if (ev.key === "Enter"){ const b2=$("[data-evocommit]"); if (b2) b2.click(); } };
  const gevoin = $("#gevoin");
  if (gevoin) gevoin.onkeydown = ev => { if (ev.key === "Enter"){ const b2=$("[data-gevocommit]"); if (b2) b2.click(); } };

  all("[data-causeopen]", b => b.onclick = () => {
    const r = b.dataset.causeopen;
    ui.cause = ui.cause === r ? null : r; ui.gcause = null;
    SFX.tap(); render();
  });
  all("[data-gcauseopen]", b => b.onclick = () => {
    const id = b.dataset.gcauseopen;
    ui.gcause = ui.gcause === id ? null : id; ui.cause = null;
    SFX.tap(); render();
  });
  all("[data-causedone]", b => b.onclick = () => {
    ui.cause = null; ui.gcause = null; SFX.tap(); render();
  });
  const cin = $("#causein") || $("#gcausein");
  if (cin) cin.onkeydown = ev => {
    if (ev.key === "Enter"){ ui.cause = null; ui.gcause = null; render(); }
  };

  all("[data-finish]", b => b.onclick = () => {
    const dd = gd();
    if (!dd.hof) return;
    dd.hof.finished = new Date().toISOString().slice(0,10);
    dd.hof.legends = legendRows().filter(x => x.st === "caught" || x.st === "dead").length;
    SFX.badge(); save(); render();
  });

  const aq = $("#areaq");
  if (aq){
    aq.oninput = () => { ui.q = aq.value; render(); };
    if (ui.qFocus){ aq.focus(); const n = aq.value.length; try { aq.setSelectionRange(n, n); } catch(e){} }
  }
  all("[data-qclear]", b => b.onclick = () => { ui.q = ""; SFX.tap(); render(); });

  all("[data-pickgame]", b => b.onclick = () => {
    ui.pick = ui.pick || [];
    const id = b.dataset.pickgame, i = ui.pick.indexOf(id);
    if (i >= 0) ui.pick.splice(i, 1); else ui.pick.push(id);
    SFX.tap(); renderSetup();
  });
  const sr = $("#startrun");
  if (sr) sr.onclick = () => {
    if (!ui.pick || !ui.pick.length) return;
    if (ui.wipeOnStart){
      if (!confirm("Last check. Every run, graveyard and Hall of Fame will be deleted for good. Continue?")) return;
      S.games = {}; GAMES.forEach(g => S.games[g.id] = freshGame());
    }
    S.loadout = ui.pick.slice();
    S.active = S.loadout[0];
    ui.setup = false; ui.pick = null; ui.wipeOnStart = false; ui.armReset = false; ui.firstRun = false;
    ui.tab = "areas"; ui.filter = "todo"; ui.q = "";
    SFX.badge(); save(); render();
  };
  const cs = $("#cancelsetup");
  if (cs) cs.onclick = () => { ui.setup = false; ui.pick = null; ui.wipeOnStart = false; ui.armReset = false; ui.firstRun = false; SFX.tap(); render(); };
  all("[data-resetarm]", b => b.onclick = () => { ui.armReset = true; SFX.tap(); render(); });
  all("[data-resetcancel]", b => b.onclick = () => { ui.armReset = false; SFX.tap(); render(); });
  all("[data-resetgo]", b => b.onclick = () => {
    ui.setup = true; ui.pick = loadout().slice(); ui.wipeOnStart = true; ui.armReset = false;
    SFX.tap(); renderSetup();
  });

  all("[data-gmove]", b => b.onclick = () => {
    const id = b.dataset.gmove;
    ui.gmove = ui.gmove === id ? null : id; ui.gevolve = null; ui.gcause = null;
    SFX.tap(); render();
  });
  all("[data-gmovecancel]", b => b.onclick = () => { ui.gmove = null; SFX.tap(); render(); });
  all("[data-gmovego]", b => b.onclick = () => {
    const id = b.dataset.gmovego, sel = $("#gmovesel");
    if (!sel || !sel.value) return;
    const r = sel.value, gs = gd().gifts || [];
    const i = gs.findIndex(y => String(y.id) === String(id));
    if (i < 0) return;
    const e0 = gd().log[r] || {};
    if (e0.species || e0.lost) return;
    const x = gs[i];
    if (x.gid) gd().grave = (gd().grave || []).filter(z => z.id !== x.gid);
    gs.splice(i, 1);
    gd().log[r] = { species:x.species, dead:false, caught:x.caught, cause:x.cause || "" };
    if (x.dead) markDead(r);
    ui.gmove = null; SFX.catch(); save(); render();
  });

  const ex = $("#export");
  if (ex) ex.onclick = () => {
    const blob = new Blob([JSON.stringify(S,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "nuzlocke-gauntlet-" + new Date().toISOString().slice(0,10) + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
  };

  const mb = $("#mute");
  if (mb) mb.onclick = () => {
    muted = !muted;
    try { localStorage.setItem("nz-mute", muted ? "1" : "0"); } catch(e){}
    if (!muted) SFX.open();
    mb.classList.toggle("on", !muted);
    mb.classList.toggle("off", muted);
    mb.title = muted ? "Sound off" : "Sound on";
    mb.setAttribute("aria-label", mb.title);
    mb.setAttribute("aria-pressed", muted ? "false" : "true");
    const st0 = document.getElementById("status");
    if (st0){
      const c0 = _audio();
      st0.className = "";
      const _m = "snd " + _how + " \u00b7 ok" + _ok + " err" + _err + " \u00b7 sink " + (_sink ? (_sink.paused ? "paused" : "playing") : "none") + " \u00b7 ctx " + (c0 ? c0.state : "none") + " buf" + Object.keys(_buf).length;
            st0.textContent = _m;
            setTimeout(() => { if (st0.textContent === _m) st0.textContent = ""; }, 5000);
    }
  };
  const im = $("#import"), f = $("#file");
  if (im && f){
    im.onclick = () => f.click();
    f.onchange = () => {
      const file = f.files[0]; if (!file) return;
      const fr = new FileReader();
      fr.onload = () => {
        try {
          const p = JSON.parse(fr.result);
          if (p.active) S.active = p.active;
          GAMES.forEach(g => S.games[g.id] = Object.assign(freshGame(), p.games && p.games[g.id]));
          save(); render();
        } catch(e){
          const st = document.getElementById("status");
          if (st){ st.textContent = "That file didn't load"; st.className = "err"; }
        }
      };
      fr.readAsText(file);
    };
  }
}

const _fresh = (() => { try { return !localStorage.getItem(KEY); } catch(e){ return false; } })();
load();
if (!Array.isArray(S.loadout) || !S.loadout.length) S.loadout = GAMES.map(g => g.id);
S.loadout = S.loadout.filter(id => GAMES.some(g => g.id === id));
if (!S.loadout.length) S.loadout = GAMES.map(g => g.id);
if (S.loadout.indexOf(S.active) < 0) S.active = S.loadout[0];
if (_fresh){ ui.setup = true; ui.pick = []; ui.firstRun = true; }
render();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
